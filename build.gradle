plugins {
    id 'java'
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
    id 'jacoco'
}

group = "${group}"
version = "${version}"
description = "${description}"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of("${javaVersion}" as Integer)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // JSON / Date handling
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonJsr310Version}"

    // JWT - SECURITY UPDATE: Updated to latest secure version
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    implementation "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    implementation "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // Liquibase
    implementation 'org.liquibase:liquibase-core'

    // Database driver (runtime)
    runtimeOnly 'org.postgresql:postgresql'

    // Logging
    implementation 'org.slf4j:slf4j-ext'

    // Apache Commons - SECURITY FIX: Updated to correct latest version
    implementation "commons-beanutils:commons-beanutils:${commonsBeanutilsVersion}"

    // OpenAPI - Updated to latest version
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Lombok for test sources (needed by Cucumber step/helper/hooks classes)
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Testing - Spring Boot test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Testcontainers - for integration tests with PostgreSQL (test scope)
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    testImplementation "org.testcontainers:testcontainers:${testcontainersVersion}"

    // Cucumber BDD - Java + Spring + JUnit Platform Engine
    testImplementation "io.cucumber:cucumber-java:${cucumberVersion}"
    testImplementation "io.cucumber:cucumber-spring:${cucumberVersion}"
    testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}"

    // JUnit Platform Suite - needed to drive @Suite runner for Cucumber
    testImplementation "org.junit.platform:junit-platform-suite"
    testRuntimeOnly  "org.junit.platform:junit-platform-suite-engine"

    // RestAssured - HTTP client for Cucumber step definitions
    testImplementation "io.rest-assured:rest-assured:${restAssuredVersion}"
}

tasks.named('test') {
    useJUnitPlatform()
    // Exclude Cucumber suite runners from the default test task to prevent double-execution
    exclude '**/cucumber/runner/**'
    finalizedBy jacocoTestReport
    // Ensure Gradle test runner has DOCKER_HOST set (Windows named pipe fallback) so Testcontainers
    // can find Docker when tests are run via IDE or the default 'test' task.
    environment 'DOCKER_HOST', (System.getenv('DOCKER_HOST') ?: 'npipe:////./pipe/docker_engine')
}

// -------------------------------------------------------
// Dedicated task: runs only Cucumber BDD integration tests
// Usage: ./gradlew cucumberTest
// -------------------------------------------------------
tasks.register('cucumberTest', Test) {
    description = 'Runs Cucumber BDD integration tests (Auth API scenarios)'
    group = 'verification'
    useJUnitPlatform()
    include '**/cucumber/runner/**'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'cucumber.junit-platform.naming-strategy', 'long'
    outputs.upToDateWhen { false }

    // On Windows (Rancher Desktop / Docker Desktop), the Testcontainers Docker client
    // needs DOCKER_HOST set to the named-pipe path.  We honour the env var if already
    // set, and fall back to the Windows named-pipe default so the task works out-of-the-box.
    environment 'DOCKER_HOST',
            (System.getenv('DOCKER_HOST') ?: 'npipe:////./pipe/docker_engine')

    // Disable JaCoCo agent on this task entirely:
    // 1. Integration tests don't need code-coverage tracking.
    // 2. JaCoCo's bytecode transformer crashes on JDK-internal classes
    //    compiled with Java 23 (class file version 67) if the JaCoCo
    //    version does not yet support that version.
    jacoco {
        enabled = false
    }

    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
}

// JaCoCo Configuration
jacoco {
    toolVersion = "${jacocoVersion}"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                "**/config/**",
                "**/dto/**",
                "**/entity/**",
                "**/model/**",
                "**/*Application*",
                "**/*Config*"
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                // Set to 0% for now since no test cases exist yet
                // Change to 0.70 (70%) when test cases are added
                minimum = 0.0
            }
        }
    }
}

// Apply stats configuration from separate file
apply from: 'gradle/loc-stats.gradle'

// Make build depend on code coverage verification and also run locStats as part of build
build.dependsOn jacocoTestCoverageVerification
build.dependsOn locStats
