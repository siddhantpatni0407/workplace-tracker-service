plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sid.app'
version = '0.0.1-SNAPSHOT'
description = 'Workplace Tracker Application'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    testcontainersVersion = '1.20.3' // Updated from 1.19.0
    jjwtVersion = '0.12.6' // Updated from 0.11.5 - SECURITY FIX
    lombokVersion = '1.18.34' // Updated from 1.18.30
    jacksonJsr310Version = '2.18.1' // Updated from 2.16.1 - SECURITY FIX
}

dependencies {
    // Spring starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // JSON / Date handling
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonJsr310Version}"

    // JWT - SECURITY UPDATE: Updated to latest secure version
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    implementation "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    implementation "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // Liquibase
    implementation 'org.liquibase:liquibase-core'

    // Database driver (runtime)
    runtimeOnly 'org.postgresql:postgresql'

    // Logging
    implementation 'org.slf4j:slf4j-ext'

    // Apache Commons - SECURITY FIX: Updated to correct latest version
    implementation 'commons-beanutils:commons-beanutils:1.9.4' // This is actually the latest stable version

    // OpenAPI - Updated to latest version
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0' // Updated from 2.3.0

    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Testing - Spring Boot test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Testcontainers - for integration tests with PostgreSQL (test scope)
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    testImplementation "org.testcontainers:testcontainers:${testcontainersVersion}"
}

tasks.named('test') {
    useJUnitPlatform()
}
