spring:
  application:
    name: workplace-tracker-service

  main:
    allow-bean-definition-overriding: true

  banner:
    location: classpath:banner.txt
    mode: console

  security:
    user:
      name: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin}
      roles: ACTUATOR_ADMIN

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/workplace_tracker_db
    username: postgres
    password: root
    properties:
      charSet: UTF-8
    hikari:
      minimum-idle: 2
      maximum-pool-size: 25
      idle-timeout: 10000
      pool-name: HikariCP
      max-lifetime: 7200000
      connection-timeout: 30000
      schema: dev

  jpa:
    show-sql: false
    properties:
      hibernate:
        default_schema: ${JPA_DEFAULT_SCHEMA:dev}
        globally_quoted_identifiers: true
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata
          lob:
            non_contextual_creation: true

encryption:
  aes:
    algorithm: ${AES_ALGORITHM:AES}
    secret-key: ${AES_SECRET_KEY:Xf9aLp3qzT7vN2sYgW5KbVc6Rm8QJ0dP}

app:
  daily-view:
    max-range-days: ${DAILY_VIEW_MAX_RANGE:366}
  backup:
    directory: C:\Backup\Database\workplace_tracker_db
    prefix: db_backup
    default-db: workplace_tracker_db

  jwt:
    secret: ${APP_JWT_SECRET:my-super-secret-key-which-is-at-least-32-characters-long!}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:3600000}
    allowed-clock-skew-sec: ${APP_JWT_ALLOWED_CLOCK_SKEW_SEC:10}

ui:
  host: ${UI_HOST:http://localhost,http://127.0.0.1,http://192.168.1.11}
  port: ${UI_PORT:3010}

server:
  port: ${SERVER_PORT:8010}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    default-model-rendering: model
    persist-authorization: true
    filter: true
    doc-expansion: none
    default-models-expand-depth: 2
    default-model-expand-depth: 2
    show-extensions: true
    show-common-extensions: true
    syntax-highlight:
      activated: true
      theme: monokai
  show-actuator: false
  packages-to-scan: com.sid.app.controller

logging:
  level:
    root: INFO
    com.sid: INFO
    org.liquibase: DEBUG
    org.springframework.boot.autoconfigure.liquibase: DEBUG
